/* ---------------------------------------------------------
   SCORING CONFIG — same logic as the agreed formula.
   Field names match harmonize.py's output exactly, so
   data.json can be dropped in with zero translation.
--------------------------------------------------------- */
const WEIGHTS = {
  orders_completed: 0.30,
  unacceptance_rate: 0.22,
  rejection_rate: 0.18,
  delta_time: 0.14,
  attendance_pct: 0.08,
  rating: 0.08,
};
const ELIGIBILITY_MIN_ORDERS = 25;

const METRIC_META = [
  { key: "orders_completed",  label: "Orders Completed",   short: "ORD", unit: "",   weight: WEIGHTS.orders_completed,  higherIsBetter: true },
  { key: "unacceptance_rate", label: "Unacceptance Rate",  short: "UNA", unit: "%",  weight: WEIGHTS.unacceptance_rate, higherIsBetter: false },
  { key: "rejection_rate",    label: "Rejection Rate",     short: "REJ", unit: "%",  weight: WEIGHTS.rejection_rate,    higherIsBetter: false },
  { key: "delta_time",        label: "Delta Time",         short: "DLT", unit: "min",weight: WEIGHTS.delta_time,        higherIsBetter: false },
  { key: "attendance_pct",    label: "Attendance",         short: "ATT", unit: "%",  weight: WEIGHTS.attendance_pct,    higherIsBetter: true },
  { key: "rating",            label: "Rating",             short: "RTG", unit: "\u2605", weight: WEIGHTS.rating,       higherIsBetter: true },
];

/* ---------------------------------------------------------
   SCORING ENGINE
--------------------------------------------------------- */
function percentileRanks(values) {
  const sorted = [...values].sort((a, b) => a - b);
  return values.map((v) => {
    const countBelow = sorted.filter((s) => s < v).length;
    const countEqual = sorted.filter((s) => s === v).length;
    const denom = sorted.length - 1;
    if (denom <= 0) return 0;
    return ((countBelow + 0.5 * (countEqual - 1)) / denom) * 100;
  });
}

function computeScoreboard(riders) {
  const eligible = riders.filter(
    (r) => r.eligible_for_scoring === true || Number(r.orders_completed) >= ELIGIBILITY_MIN_ORDERS
  );
  const excludedCount = riders.length - eligible.length;

  const percentiles = {};
  METRIC_META.forEach((m) => {
    const vals = eligible.map((r) => Number(r[m.key]) || 0);
    const pctl = percentileRanks(vals);
    percentiles[m.key] = m.higherIsBetter ? pctl : pctl.map((p) => 100 - p);
  });

  const scored = eligible.map((r, i) => {
    const metricPctls = {};
    let composite = 0;
    METRIC_META.forEach((m) => {
      const p = percentiles[m.key][i];
      metricPctls[m.key] = p;
      composite += p * m.weight;
    });
    return { ...r, metricPctls, composite };
  });

  scored.sort((a, b) => {
    if (b.composite !== a.composite) return b.composite - a.composite;
    return (a.unacceptance_rate || 0) - (b.unacceptance_rate || 0); // tie-break
  });
  scored.forEach((r, i) => (r.rank = i + 1));

  return {
    ranked: scored,
    excludedCount,
    totalOrders: riders.reduce((s, r) => s + (Number(r.orders_completed) || 0), 0),
  };
}

/* ---------------------------------------------------------
   UI COMPONENTS
--------------------------------------------------------- */
function SummaryStat({ label, value, muted, accent }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
      <div style={{ fontSize: 10.5, color: "#5C6670", letterSpacing: "0.08em" }}>{label}</div>
      <div className="disp" style={{ fontSize: 22, fontWeight: 600, color: muted ? "#8B95A1" : (accent || "#EDEEF0") }}>
        {value}
      </div>
    </div>
  );
}

function RankBadge({ rank }) {
  const colors = { 1: "#C81E05", 2: "#C9CDD3", 3: "#B5793B" };
  const c = colors[rank] || "#33404A";
  return (
    <div className="disp" style={{
      width: 44, height: 44, borderRadius: "50%", border: `2px solid ${c}`,
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: 18, fontWeight: 700, color: c, flexShrink: 0,
    }}>
      {rank}
    </div>
  );
}

// Hand-built SVG hexagon radar — no charting library required
function RadarHexagon({ rider }) {
  const size = 180, cx = size / 2, cy = size / 2, r = 62;
  const n = METRIC_META.length;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;

  const pointAt = (i, val) => {
    const rad = (Math.max(0, Math.min(100, val)) / 100) * r;
    return [cx + rad * Math.cos(angle(i)), cy + rad * Math.sin(angle(i))];
  };
  const gridPointAt = (i, frac) => {
    const rad = frac * r;
    return [cx + rad * Math.cos(angle(i)), cy + rad * Math.sin(angle(i))];
  };

  const dataPoints = METRIC_META.map((m, i) => pointAt(i, rider.metricPctls[m.key]));
  const dataPath = dataPoints.map((p) => p.join(",")).join(" ");

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[0.33, 0.66, 1].map((frac, gi) => (
        <polygon
          key={gi}
          points={METRIC_META.map((_, i) => gridPointAt(i, frac).join(",")).join(" ")}
          fill="none" stroke="#2B333A" strokeWidth="1"
        />
      ))}
      {METRIC_META.map((m, i) => {
        const [x, y] = gridPointAt(i, 1);
        return <line key={m.key} x1={cx} y1={cy} x2={x} y2={y} stroke="#2B333A" strokeWidth="1" />;
      })}
      <polygon points={dataPath} fill="#C81E05" fillOpacity="0.22" stroke="#C81E05" strokeWidth="2" />
      {METRIC_META.map((m, i) => {
        const [x, y] = gridPointAt(i, 1.24);
        return (
          <text key={m.key} x={x} y={y} fill="#8B95A1" fontSize="10.5"
                textAnchor="middle" dominantBaseline="middle" fontFamily="JetBrains Mono, monospace">
            {m.short}
          </text>
        );
      })}
    </svg>
  );
}

function RiderRow({ rider, isExpanded, onToggle }) {
  return (
    <div className="stub-row" style={{
      marginLeft: 8, marginBottom: 10,
      background: rider.rank <= 3 ? "#231512" : "#1B2126",
      border: `1px solid ${rider.rank === 1 ? "#C81E0555" : "#262E35"}`,
      borderRadius: 4,
    }}>
      <div onClick={onToggle} style={{
        display: "flex", alignItems: "center", gap: 18, padding: "14px 20px",
        cursor: "pointer", flexWrap: "wrap",
      }}>
        <RankBadge rank={rider.rank} />

        <div style={{ minWidth: 160 }}>
          <div className="disp" style={{ fontSize: 18, fontWeight: 600 }}>{rider.rider_name}</div>
          <div style={{ fontSize: 10.5, color: "#5C6670" }}>{rider.vehicle_type || ""}</div>
        </div>

        <div style={{ display: "flex", gap: 5, flex: 1, minWidth: 160, alignItems: "center" }}>
          {METRIC_META.map((m) => (
            <div key={m.key} title={`${m.label}: ${rider[m.key]}${m.unit}`} style={{ flex: 1 }}>
              <div className="metric-bar-track" style={{ height: 5, borderRadius: 2, overflow: "hidden" }}>
                <div style={{
                  width: `${Math.max(0, Math.min(100, rider.metricPctls[m.key]))}%`, height: "100%",
                  background: m.higherIsBetter ? "#F0A202" : "#C81E05",
                }} />
              </div>
            </div>
          ))}
        </div>

        <div style={{ textAlign: "right", minWidth: 90 }}>
          <div style={{ fontSize: 10, color: "#5C6670", letterSpacing: "0.08em" }}>SCORE</div>
          <div className="disp" style={{ fontSize: 24, fontWeight: 700, color: "#C81E05" }}>
            {rider.composite.toFixed(1)}
          </div>
        </div>

        <div style={{ color: "#5C6670", transform: isExpanded ? "rotate(180deg)" : "none", transition: "transform 0.15s" }}>▾</div>
      </div>

      {isExpanded && (
        <div style={{ borderTop: "1px dashed #2B333A", padding: "18px 20px 22px", display: "flex", gap: 32, flexWrap: "wrap" }}>
          <RadarHexagon rider={rider} />
          <div style={{ flex: 1, minWidth: 260, display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px 24px" }}>
            {METRIC_META.map((m) => (
              <div key={m.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, borderBottom: "1px solid #23292F", paddingBottom: 6 }}>
                <span style={{ color: "#8B95A1" }}>{m.label}</span>
                <span style={{ color: "#EDEEF0", fontWeight: 600 }}>
                  {rider[m.key]}{m.unit}
                  <span style={{ color: "#5C6670", fontWeight: 400 }}> · {rider.metricPctls[m.key].toFixed(0)}th pctl</span>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function DataSourceBanner({ isLive }) {
  if (isLive) return null;
  return (
    <div style={{
      background: "#2A1210", border: "1px solid #C81E0555", color: "#E8846E",
      fontSize: 12, padding: "8px 32px", display: "flex", alignItems: "center", gap: 8,
    }}>
      ⚠ Showing embedded sample data — data.json wasn't found alongside this file.
      Once both files sit in the same folder (e.g. your GitHub Pages repo), live data loads automatically.
    </div>
  );
}

function App() {
  const [riders, setRiders] = useState(null);
  const [meta, setMeta] = useState({ weekLabel: "" });
  const [isLive, setIsLive] = useState(false);
  const [expandedId, setExpandedId] = useState(null);

  useEffect(() => {
    fetch("./data.json")
      .then((res) => {
        if (!res.ok) throw new Error("not found");
        return res.json();
      })
      .then((json) => {
        const list = Array.isArray(json) ? json : (json.riders || []);
        setRiders(list);
        setMeta({ weekLabel: json.week_label || "" });
        setIsLive(true);
      })
      .catch(() => {
        // Fall back to the embedded dataset baked into this file
        try {
          const raw = document.getElementById("embedded-fallback-data").textContent;
          const json = JSON.parse(raw);
          setRiders(json.riders || []);
          setMeta({ weekLabel: json.week_label || "" });
          setIsLive(false);
        } catch (e) {
          setRiders([]);
        }
      });
  }, []);

  if (!riders) {
    return <div style={{ padding: 40, color: "#8B95A1" }}>Loading dispatch board…</div>;
  }

  const { ranked, excludedCount, totalOrders } = computeScoreboard(riders);
  const top10 = ranked.slice(0, 10);
  const avgDelta = ranked.length ? (ranked.reduce((s, r) => s + Number(r.delta_time || 0), 0) / ranked.length).toFixed(1) : "0";

  return (
    <div style={{ minHeight: "100vh" }}>
      <div className="brand-stripe" />
      <DataSourceBanner isLive={isLive} />
      <div style={{ borderBottom: "1px solid #262E35", padding: "24px 32px 22px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 4 }}>
          <img src={ANDO_LOGO} alt="ando" style={{ width: 34, height: 34, borderRadius: 6, display: "block" }} />
          <div className="disp" style={{ fontSize: 13, letterSpacing: "0.18em", color: "#8B95A1", fontWeight: 600 }}>
            RIDER PERFORMANCE MANIFEST
          </div>
        </div>
        <h1 className="disp" style={{ fontSize: 40, fontWeight: 700, letterSpacing: "0.01em", margin: "2px 0 18px" }}>
          WEEKLY DISPATCH BOARD{meta.weekLabel ? " — " + meta.weekLabel.toUpperCase() : ""}
        </h1>
        <div style={{ display: "flex", gap: 28, flexWrap: "wrap" }}>
          <SummaryStat label="ELIGIBLE RIDERS" value={ranked.length} accent="#F0A202" />
          <SummaryStat label="TOTAL ORDERS (FLEET)" value={totalOrders} accent="#F0A202" />
          <SummaryStat label="AVG DELTA TIME" value={avgDelta + " min"} accent="#F0A202" />
          <SummaryStat label="BELOW THRESHOLD" value={excludedCount + " riders"} muted />
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", padding: "18px 32px", borderBottom: "1px solid #1D2429" }}>
        {METRIC_META.map((m) => (
          <div key={m.key} style={{
            border: "1px solid #2B333A", borderRadius: 3, padding: "5px 10px", fontSize: 11,
            color: "#8B95A1", display: "flex", gap: 6, alignItems: "center",
          }}>
            <span style={{ color: "#EDEEF0", fontWeight: 600 }}>{m.short}</span>
            <span style={{ color: m.higherIsBetter ? "#F0A202" : "#C81E05" }}>{(m.weight * 100).toFixed(0)}%</span>
          </div>
        ))}
        <div style={{ fontSize: 11, color: "#5C6670", alignSelf: "center", marginLeft: 4 }}>
          · min. {ELIGIBILITY_MIN_ORDERS} orders/week to qualify · top 10 receive weekly cash voucher
        </div>
      </div>

      <div style={{ padding: "20px 32px 48px" }}>
        {top10.map((rider) => (
          <RiderRow
            key={rider.rider_name}
            rider={rider}
            isExpanded={expandedId === rider.rider_name}
            onToggle={() => setExpandedId(expandedId === rider.rider_name ? null : rider.rider_name)}
          />
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
